services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mtch
      POSTGRES_USER: mtch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mtch -d mtch"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: mtch-app:local
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://mtch:${POSTGRES_PASSWORD}@db:5432/mtch
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  seed:
    image: mtch-app:local
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgres://mtch:${POSTGRES_PASSWORD}@db:5432/mtch
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      MEDIA_DIR: /app/media
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  app:
    image: mtch-app:local
    build: .
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://mtch:${POSTGRES_PASSWORD}@db:5432/mtch
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  media:
